# =============================================================================
#  FLORIS v4 input file - TEMPLATE for one wind park
# =============================================================================
#  How to use it:
#    1. Copy this file once per park:   park_A.yaml, park_B.yaml, ...
#    2. Edit the sections marked  >>> EDIT <<<  (layout + turbine type).
#       The other sections can stay as they are.
#    3. Reference the file in PARKS at the top of 1_wake_directions.py:
#         PARKS = {"park_A": "park_A.yaml", "park_B": "park_B.yaml"}
#       The key ("park_A") must be the same in 2_analyse_predictions.py.
#
#  What the script uses from this file:
#    - farm        -> where the turbines are and which turbine model they are
#    - wake        -> which wake model is used to compute the losses
#    - flow_field  -> air density, shear, veer (wind direction / speed / TI
#                     are OVERWRITTEN by the script, see below)
#
#  Check that FLORIS reads your file before running the full script:
#    python -c "from floris import FlorisModel; m = FlorisModel('park_A.yaml'); print(m.n_turbines, 'turbines')"
# =============================================================================

name: park_example                 # free text, only for you
description: "Template - replace with the name of your park"
floris_version: v4                 # must stay v4 (the script needs FLORIS >= 4)

logging:
  console:
    enable: true
    level: WARNING
  file:
    enable: false
    level: WARNING

solver:
  type: turbine_grid               # keep: fastest solver, enough to get powers
  turbine_grid_points: 3           # points per rotor side (3 x 3); 3 is fine

# -----------------------------------------------------------------------------
#  >>> EDIT <<<  FARM: layout and turbines
# -----------------------------------------------------------------------------
farm:
  # Turbine positions in METRES, in a local flat (x, y) frame:
  #   x = towards the EAST, y = towards the NORTH.
  #   The origin is free (e.g. the first turbine at 0, 0): only distances and
  #   orientation matter. The orientation DOES matter: wind directions are
  #   measured from north, so y must really point north, otherwise all the
  #   wake directions will be rotated.
  #
  # Starting from GPS coordinates (lat / lon), convert to UTM metres, e.g.:
  #   from pyproj import Transformer
  #   t = Transformer.from_crs("EPSG:4326", "EPSG:32631", always_xy=True)  # 32631 = UTM zone 31N (France)
  #   x, y = t.transform(lon, lat)
  #   then subtract the min of x and y to start near (0, 0).
  #
  # layout_x and layout_y must have the same length (one entry per turbine),
  # in the same order. The turbine index on the layout plot (T0, T1, ...)
  # follows this order.
  layout_x:
  - 0.0
  - 630.0
  - 1260.0
  - 0.0
  - 630.0
  - 1260.0
  layout_y:
  - 0.0
  - 0.0
  - 0.0
  - 630.0
  - 630.0
  - 630.0

  # Turbine model. Either:
  #   - ONE name in a list -> applied to all turbines, or
  #   - one name PER turbine (same length as layout_x) if the park mixes models.
  #
  # Built-in models (shipped with FLORIS):
  #   nrel_5MW, iea_10MW, iea_15MW, iea_22MW
  # Use the one closest to your real turbine (rated power, rotor diameter,
  # hub height). The rotor diameter matters most: wake distances scale with it.
  #
  # Using your real turbine (recommended): create a folder "turbines/" in the
  # folder you run the scripts from (the path is relative to the current
  # working directory, NOT to this yaml) with e.g. "turbines/my_turbine.yaml"
  # (the file name without .yaml must match turbine_type; copy a built-in file,
  # from <python site-packages>/floris/turbine_library/, and change
  # turbine_type, hub_height, rotor_diameter and the power_thrust_table:
  # wind_speed, power in kW, thrust_coefficient from the manufacturer's
  # datasheet), then uncomment turbine_library_path and write
  #   turbine_type:
  #   - my_turbine
  # turbine_library_path: turbines
  turbine_type:
  - nrel_5MW

# -----------------------------------------------------------------------------
#  FLOW FIELD: atmospheric conditions
# -----------------------------------------------------------------------------
flow_field:
  # wind_directions, wind_speeds and turbulence_intensities are REPLACED by
  # the script (360 directions, REF_WIND_SPEED, TURBULENCE_INTENSITY at the top
  # of 1_wake_directions.py). One value each is enough here.
  wind_directions:
  - 270.0
  wind_speeds:
  - 8.0
  turbulence_intensities:
  - 0.06
  air_density: 1.225               # kg/m3, can adapt to the site (1.225 = sea level, 15 °C)
  reference_wind_height: -1        # -1 = use the hub height of the turbines
  wind_shear: 0.12                 # power-law exponent: ~0.10 offshore, 0.14-0.25 onshore
  wind_veer: 0.0

# -----------------------------------------------------------------------------
#  WAKE MODEL: can stay as is (FLORIS default = Gauss-Curl Hybrid, "GCH")
# -----------------------------------------------------------------------------
#  Other common choices for velocity_model: jensen (simple, pessimistic),
#  cc (cumulative curl, better for big farms), turbopark (offshore clusters).
#  If you change velocity_model, add its parameters under
#  wake_velocity_parameters (see <site-packages>/floris/default_inputs.yaml).
wake:
  model_strings:
    combination_model: sosfs
    deflection_model: gauss
    turbulence_model: crespo_hernandez
    velocity_model: gauss

  enable_secondary_steering: true
  enable_yaw_added_recovery: true
  enable_transverse_velocities: true
  enable_active_wake_mixing: false

  wake_deflection_parameters:
    gauss:
      ad: 0.0
      alpha: 0.58
      bd: 0.0
      beta: 0.077
      dm: 1.0
      ka: 0.38
      kb: 0.004

  wake_velocity_parameters:
    gauss:
      alpha: 0.58
      beta: 0.077
      ka: 0.38                     # wake expansion: higher = wakes recover faster
      kb: 0.004

  wake_turbulence_parameters:
    crespo_hernandez:
      initial: 0.1
      constant: 0.5
      ai: 0.8
      downstream: -0.32
